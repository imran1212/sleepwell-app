name: SleepWell Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter packages
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run widget tests
        run: flutter test --reporter expanded

      - name: Generate Android platform scaffold
        run: |
          flutter create --platforms=android --project-name sleepwell_app --overwrite /tmp/sleepwell_platform
          cp -R /tmp/sleepwell_platform/android ./android
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />|' android/app/src/main/AndroidManifest.xml
          # Pin Android toolchain for the current Kotlin DSL scaffold.
          if [ -f android/settings.gradle.kts ]; then
            sed -i 's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.12.1"/' android/settings.gradle.kts
            sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.2.20"/' android/settings.gradle.kts
          else
            sed -i 's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.12.1"/' android/settings.gradle
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.2.20"/' android/settings.gradle
          fi
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties
          echo "---- Pinned Android toolchain ----"
          grep -E 'com.android.application|org.jetbrains.kotlin.android' android/settings.gradle* 
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Force flutter_timezone Kotlin compile target to Java 11
        run: |
          PLUGIN_DIR="$HOME/.pub-cache/hosted/pub.dev/flutter_timezone-3.0.1/android"
          echo "---- Original plugin Gradle file ----"
          cat "$PLUGIN_DIR/build.gradle"
          sed -i -E "s/1[.]8/11/g; s/JVM_1_8/JVM_11/g" "$PLUGIN_DIR/build.gradle"
          cat >> "$PLUGIN_DIR/build.gradle" <<'GRADLE'

          // Work around Java/Kotlin JVM target mismatch in this plugin.
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "11"
              }
          }
          GRADLE
          echo "---- Patched plugin Gradle file ----"
          tail -n 18 "$PLUGIN_DIR/build.gradle"

      - name: Enable core library desugaring for notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")
          p = kts if kts.exists() else groovy
          if not p.exists():
              raise SystemExit("Android app Gradle file not found")
          s = p.read_text()
          if "compileOptions {" not in s:
              raise SystemExit("compileOptions block not found")
          if p.suffix == ".kts":
              s = s.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true", 1)
              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
              s = s.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true", 1)
              dep = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
          if "desugar_jdk_libs" not in s:
              if "dependencies {" in s:
                  s = s.replace("dependencies {", "dependencies {\n    " + dep, 1)
              else:
                  s += "\n\ndependencies {\n    " + dep + "\n}\n"
          p.write_text(s)
          print("Patched:", p)
          print("\n".join(line for line in s.splitlines() if "compileOptions" in line or "CoreLibraryDesugaring" in line or "coreLibraryDesugaring" in line or "desugar_jdk" in line))
          if "desugar_jdk_libs" not in s:
              raise SystemExit("Desugaring dependency insertion failed")
          PY

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sleepwell-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 90
