name: SleepWell Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter packages
        run: flutter pub get

      - name: Generate and print debug signing certificate SHA-1
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -alias androiddebugkey \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android -keypass android | grep -E 'SHA1:|SHA-1:'

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run widget tests
        run: flutter test --reporter expanded

      - name: Generate Android platform scaffold
        run: |
          flutter create --platforms=android --project-name sleepwell_app --overwrite /tmp/sleepwell_platform
          cp -R /tmp/sleepwell_platform/android ./android
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />|' android/app/src/main/AndroidManifest.xml
          python3 - <<'PYADS'
          from pathlib import Path
          import re
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          metadata = '''        <meta-data
                          android:name="com.google.android.gms.ads.APPLICATION_ID"
                          android:value="ca-app-pub-3940256099942544~3347511713" />
          '''
          if "com.google.android.gms.ads.APPLICATION_ID" not in s:
              match = re.search(r"<application\b[^>]*>", s)
              if not match:
                  raise SystemExit("Android application opening tag not found; refusing to continue")
              s = s[:match.end()] + "\n" + metadata + s[match.end():]
              p.write_text(s)
          print("Configured Google test AdMob Application ID inside the application element.")
          PYADS
          # Set the Play Console package name consistently for the generated Android app.
          python3 - <<'PYID'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          if not p.exists():
              raise SystemExit("Expected Kotlin Gradle app file was not generated")
          s = p.read_text()
          s = s.replace('namespace = "com.example.sleepwell_app"', 'namespace = "com.svsystem.sleepwell.app"')
          s = s.replace('applicationId = "com.example.sleepwell_app"', 'applicationId = "com.svsystem.sleepwell.app"')
          p.write_text(s)
          if 'applicationId = "com.svsystem.sleepwell.app"' not in s:
              raise SystemExit("Could not set the new Android applicationId")
          print("Android namespace/applicationId set to com.svsystem.sleepwell.app")
          PYID
          # Pin Android toolchain for the current Kotlin DSL scaffold.
          if [ -f android/settings.gradle.kts ]; then
            sed -i 's/id("com.android.application") version "[^"]*"/id("com.android.application") version "8.12.1"/' android/settings.gradle.kts
            sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "2.2.20"/' android/settings.gradle.kts
          else
            sed -i 's/id "com.android.application" version "[^"]*"/id "com.android.application" version "8.12.1"/' android/settings.gradle
            sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.2.20"/' android/settings.gradle
          fi
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.14.3-bin.zip|' android/gradle/wrapper/gradle-wrapper.properties
          echo "---- Pinned Android toolchain ----"
          grep -E 'com.android.application|org.jetbrains.kotlin.android' android/settings.gradle* 
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Generate SleepWell launcher icons
        run: |
          python3 -m pip install --quiet Pillow
          python3 tool/generate_android_icons.py

      - name: Force flutter_timezone Kotlin compile target to Java 11
        run: |
          PLUGIN_DIR="$HOME/.pub-cache/hosted/pub.dev/flutter_timezone-3.0.1/android"
          echo "---- Original plugin Gradle file ----"
          cat "$PLUGIN_DIR/build.gradle"
          sed -i -E "s/VERSION_1_8/VERSION_11/g; s/JVM_1_8/JVM_11/g; s/1[.]8/11/g" "$PLUGIN_DIR/build.gradle"
          # The plugin's Android compileOptions, not just its java block, controls Javac's task target.
          python3 - <<'PYPLUGIN'
          from pathlib import Path
          p = Path.home() / ".pub-cache/hosted/pub.dev/flutter_timezone-3.0.1/android/build.gradle"
          s = p.read_text()
          if "compileOptions {" not in s:
              s = s.replace(
                  "    defaultConfig {",
                  "    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_11\n        targetCompatibility JavaVersion.VERSION_11\n    }\n    defaultConfig {",
                  1,
              )
          else:
              s = s.replace("compileOptions {", "compileOptions {\n        sourceCompatibility JavaVersion.VERSION_11\n        targetCompatibility JavaVersion.VERSION_11", 1)
          p.write_text(s)
          print("\n".join(line for line in s.splitlines() if "compileOptions" in line or "sourceCompatibility" in line or "targetCompatibility" in line))
          PYPLUGIN
          echo "---- Verify Java/Kotlin target settings ----"
          grep -nE "sourceCompatibility|targetCompatibility|jvmTarget|VERSION_1_8|JVM_1_8" "$PLUGIN_DIR/build.gradle" || true
          cat >> "$PLUGIN_DIR/build.gradle" <<'GRADLE'

          // Work around Java/Kotlin JVM target mismatch in this plugin.
          tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
              kotlinOptions {
                  jvmTarget = "11"
              }
          }
          GRADLE
          echo "---- Patched plugin Gradle file ----"
          tail -n 18 "$PLUGIN_DIR/build.gradle"

      - name: Enable core library desugaring for notifications
        run: |
          python3 - <<'PY'
          from pathlib import Path

          kts = Path("android/app/build.gradle.kts")
          groovy = Path("android/app/build.gradle")
          p = kts if kts.exists() else groovy
          if not p.exists():
              raise SystemExit("Android app Gradle file not found")
          s = p.read_text()
          if "compileOptions {" not in s:
              raise SystemExit("compileOptions block not found")
          if p.suffix == ".kts":
              s = s.replace(
                  "compileOptions {",
                  "compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_11\n        targetCompatibility = JavaVersion.VERSION_11\n        isCoreLibraryDesugaringEnabled = true",
                  1,
              )
              s = s.replace(
                  "jvmTarget = JavaVersion.VERSION_1_8.toString()",
                  'jvmTarget = "11"',
              )
              s = s.replace(
                  "jvmTarget = JavaVersion.VERSION_1_8",
                  'jvmTarget = "11"',
              )
              dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
          else:
              s = s.replace(
                  "compileOptions {",
                  "compileOptions {\n        sourceCompatibility JavaVersion.VERSION_11\n        targetCompatibility JavaVersion.VERSION_11\n        coreLibraryDesugaringEnabled true",
                  1,
              )
              s = s.replace("jvmTarget = '1.8'", "jvmTarget = '11'")
              s = s.replace('jvmTarget = "1.8"', 'jvmTarget = "11"')
              dep = "coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'"
          if "desugar_jdk_libs" not in s:
              if "dependencies {" in s:
                  s = s.replace("dependencies {", "dependencies {\n    " + dep, 1)
              else:
                  s += "\n\ndependencies {\n    " + dep + "\n}\n"
          p.write_text(s)
          print("Patched:", p)
          print("\n".join(line for line in s.splitlines() if "compileOptions" in line or "CoreLibraryDesugaring" in line or "coreLibraryDesugaring" in line or "desugar_jdk" in line))
          if "desugar_jdk_libs" not in s:
              raise SystemExit("Desugaring dependency insertion failed")
          PY

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD secret"; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS secret"; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD secret"; exit 1; }
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sleepwell-upload.jks"
          echo "SLEEPWELL_KEYSTORE_PATH=$RUNNER_TEMP/sleepwell-upload.jks" >> "$GITHUB_ENV"
          python3 - <<'PYSIGN'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          signing = """
          signingConfigs {
              create("release") {
                  storeFile = file(System.getenv("SLEEPWELL_KEYSTORE_PATH"))
                  storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword = System.getenv("ANDROID_KEY_PASSWORD")
              }
          }
          """
          if "signingConfigs {" not in s:
              s = s.replace("    buildTypes {", signing + "\n    buildTypes {", 1)
          s = s.replace(
              'getByName("release") {',
              'getByName("release") {\n            signingConfig = signingConfigs.getByName("release")',
              1,
          )
          p.write_text(s)
          print("Configured release signing from GitHub Actions secrets.")
          PYSIGN
        shell: bash

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release

      - name: Build release Android App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build appbundle --release

      - name: Print debug signing certificate SHA-1
        run: |
          keytool -list -v -alias androiddebugkey -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android | grep -E 'SHA1:|SHA-1:'
          
      - name: Upload signed release APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: sleepwell-signed-release
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 90
