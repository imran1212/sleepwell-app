name: SleepWell Android CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter packages
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run widget tests
        run: flutter test --reporter expanded

      - name: Generate Android platform scaffold
        run: |
          flutter create --platforms=android --project-name sleepwell_app --overwrite /tmp/sleepwell_platform
          cp -R /tmp/sleepwell_platform/android ./android
          sed -i 's|<manifest xmlns:android="http://schemas.android.com/apk/res/android">|<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />|' android/app/src/main/AndroidManifest.xml

      - name: Align flutter_timezone Kotlin JVM target with Java
        run: |
          find "$HOME/.pub-cache/hosted/pub.dev" -path '*/flutter_timezone-*/android/build.gradle' -type f -print -exec sed -i 's/jvmTarget = "1.8"/jvmTarget = "11"/g; s/jvmTarget = "1.8"/jvmTarget = "11"/g; s/JVM_1_8/JVM_11/g' {} \;
          find "$HOME/.pub-cache/hosted/pub.dev" -path '*/flutter_timezone-*/android/build.gradle.kts' -type f -print -exec sed -i 's/JVM_1_8/JVM_11/g; s/"1.8"/"11"/g' {} \;

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sleepwell-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 90
